name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build add-in
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          dotnet build src/PopOutlookAddin.csproj -c Release /p:Version=$v /p:AssemblyVersion="$v.0" /p:FileVersion="$v.0"
          echo "APPVER=$v.0" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APPVER" "/Ooutput" installer/PopOutlookAddin.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test install (registry + files)
        shell: pwsh
        run: |
          $p = Start-Process installer/output/PopOutlookAddin-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "installer exit $($p.ExitCode)" }
          $k = Get-ItemProperty 'HKCU:\Software\Microsoft\Office\Outlook\Addins\PopOutlookAddin.Connect'
          if ($k.LoadBehavior -ne 3) { throw 'LoadBehavior missing' }
          $t = [Type]::GetTypeFromProgID('PopOutlookAddin.Connect'); if (-not $t) { throw 'ProgID not registered' }
          $o = [Activator]::CreateInstance($t)
          $xml = $o.GetCustomUI('Microsoft.Outlook.Explorer')
          if ($xml -notmatch 'POP Tools') { throw 'Ribbon XML not returned via COM' }
          Write-Host "COM activation OK, ribbon XML length $($xml.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: PopOutlookAddin-Setup
          path: installer/output/PopOutlookAddin-Setup.exe
